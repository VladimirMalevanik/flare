services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: flare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      APP_PASSWORD: ${APP_PASSWORD:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flare_data:/var/lib/postgresql/data
      - ./backend/db/init-role.sql:/docker-entrypoint-initdb.d/01-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flare"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      FLARE_PROCESS_ROLE: api
      DATABASE_URL: postgresql://flare_app:${APP_PASSWORD:?Copy .env.example to .env}@db:5432/flare
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      FLARE_ENV: ${FLARE_ENV:-development}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-openai/gpt-oss-20b}
      LLM_DEFAULT_REASONING_EFFORT: ${LLM_DEFAULT_REASONING_EFFORT:-low}
      LLM_MAX_SOURCES: ${LLM_MAX_SOURCES:-5}
      LLM_MAX_INPUT_BYTES: ${LLM_MAX_INPUT_BYTES:-4000}
      LLM_MAX_COMPLETION_TOKENS: ${LLM_MAX_COMPLETION_TOKENS:-2000}
      FLARE_MAX_COMPLETION_TOKENS: ${FLARE_MAX_COMPLETION_TOKENS:-1024}
      FLARE_MAX_REQUEST_BYTES: ${FLARE_MAX_REQUEST_BYTES:-32000}
      SESSION_LIFETIME_SECONDS: ${SESSION_LIFETIME_SECONDS:-604800}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-86400}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      EMAIL_VERIFICATION_TTL_SECONDS: ${EMAIL_VERIFICATION_TTL_SECONDS:-86400}
      EMAIL_VERIFICATION_RESEND_SECONDS: ${EMAIL_VERIFICATION_RESEND_SECONDS:-60}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-Flare <no-reply@localhost>}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_FRONTEND_RETURN_URL: ${GITHUB_FRONTEND_RETURN_URL:-http://localhost:3000/sources}
      GITHUB_STATE_TTL_SECONDS: ${GITHUB_STATE_TTL_SECONDS:-600}
      FLARE_DEV_MODE: ${FLARE_DEV_MODE:-false}
      FLARE_DEV_WORKSPACE_ID: ${FLARE_DEV_WORKSPACE_ID:-00000000-0000-4000-8000-000000000001}
      FLARE_DEV_USER_ID: ${FLARE_DEV_USER_ID:-local-dev-user}
      FLARE_DEV_WORKSPACE_NAME: ${FLARE_DEV_WORKSPACE_NAME:-Flare Local}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      FLARE_DATABASE_PROVIDER: self-managed
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Copy .env.example to .env}@db:5432/flare
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # AI processing is opt-in locally because it needs a real Groq key. It has
  # its own least-privilege database role and never receives DATABASE_URL.
  worker-configure:
    image: pgvector/pgvector:pg17
    profiles: ["ai"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      WORKER_PASSWORD: ${WORKER_PASSWORD:?Set a local worker password in .env}
    command:
      ["sh", "-ec", "psql -h db -U postgres -d flare -v ON_ERROR_STOP=1 -f /scripts/configure-worker.sql"]
    volumes:
      - ./backend/db/configure-worker.sql:/scripts/configure-worker.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  worker:
    build: ./backend
    profiles: ["ai"]
    command: ["python", "-m", "app.workers.analysis_worker"]
    environment:
      FLARE_PROCESS_ROLE: worker
      WORKER_DATABASE_URL: postgresql://flare_worker:${WORKER_PASSWORD:?Set a local worker password in .env}@db:5432/flare
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY before starting the ai profile}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-openai/gpt-oss-20b}
      LLM_DEFAULT_REASONING_EFFORT: ${LLM_DEFAULT_REASONING_EFFORT:-low}
      LLM_MAX_SOURCES: ${LLM_MAX_SOURCES:-5}
      LLM_MAX_INPUT_BYTES: ${LLM_MAX_INPUT_BYTES:-4000}
      LLM_MAX_COMPLETION_TOKENS: ${LLM_MAX_COMPLETION_TOKENS:-2000}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-5}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-30}
      LLM_DEADLINE_SECONDS: ${LLM_DEADLINE_SECONDS:-40}
      ANALYSIS_MAX_ATTEMPTS: ${ANALYSIS_MAX_ATTEMPTS:-3}
      ANALYSIS_LEASE_SECONDS: ${ANALYSIS_LEASE_SECONDS:-120}
      ANALYSIS_POLL_SECONDS: ${ANALYSIS_POLL_SECONDS:-1}
      ANALYSIS_BACKOFF_SECONDS: ${ANALYSIS_BACKOFF_SECONDS:-5}
      ANALYSIS_MAX_BACKOFF_SECONDS: ${ANALYSIS_MAX_BACKOFF_SECONDS:-300}
      FLARE_MAX_COMPLETION_TOKENS: ${FLARE_MAX_COMPLETION_TOKENS:-1024}
      FLARE_MAX_REQUEST_BYTES: ${FLARE_MAX_REQUEST_BYTES:-32000}
    depends_on:
      worker-configure:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_DATA_PROVIDER: ${NEXT_PUBLIC_DATA_PROVIDER:-api}
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_DATA_PROVIDER: ${NEXT_PUBLIC_DATA_PROVIDER:-api}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  flare_data:
