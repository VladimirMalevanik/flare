name: checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.database_provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database_provider: self-managed
            migration_database_url: postgresql+psycopg://postgres:ci_admin@127.0.0.1:5432/flare
          - database_provider: yandex
            migration_database_url: postgresql+psycopg://flare_owner:ci_owner@127.0.0.1:5432/flare
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: flare
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d flare"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      FLARE_DATABASE_PROVIDER: ${{ matrix.database_provider }}
      OWNER_PASSWORD: ci_owner
      APP_PASSWORD: ci_app
      WORKER_PASSWORD: ci_worker
      WORKER_DATABASE_URL: postgresql://flare_worker:ci_worker@127.0.0.1:5432/flare
      PGPASSWORD: ci_admin
      DATABASE_URL: postgresql://flare_app:ci_app@127.0.0.1:5432/flare
      MIGRATION_DATABASE_URL: ${{ matrix.migration_database_url }}
      TEST_DATABASE_URL: postgresql://postgres:ci_admin@127.0.0.1:5432/flare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e 'backend[dev]'
      - name: Cache pinned ffprobe
        if: matrix.database_provider == 'self-managed'
        # Cache availability is optional; verification below is always required.
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: ${{ runner.temp }}/flare-tools/ffprobe-7.0.2/ffprobe
          key: ffprobe-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/deploy/ensure_ffprobe.py') }}
      - name: Verify pinned ffprobe and voice runtime
        if: matrix.database_provider == 'self-managed'
        timeout-minutes: 3
        run: |
          python backend/deploy/ensure_ffprobe.py --destination "$RUNNER_TEMP/flare-tools/ffprobe-7.0.2/ffprobe"
          PYTHONPATH=backend python backend/scripts/check_voice_runtime.py --ffprobe-path "$RUNNER_TEMP/flare-tools/ffprobe-7.0.2/ffprobe"
      - if: matrix.database_provider == 'self-managed'
        run: psql -h 127.0.0.1 -U postgres -d flare -v ON_ERROR_STOP=1 -f backend/db/init-role.sql
      - if: matrix.database_provider == 'yandex'
        run: psql -h 127.0.0.1 -U postgres -d flare -v ON_ERROR_STOP=1 -f backend/db/provision-yandex-test.sql
      - run: alembic -c backend/alembic.ini upgrade 0005
      - run: alembic -c backend/alembic.ini upgrade 0007
      - run: python backend/scripts/check_email_verification_migration.py prepare
      - run: alembic -c backend/alembic.ini upgrade 0014
      - run: python backend/scripts/check_daily_quota_migration.py prepare
      - run: alembic -c backend/alembic.ini upgrade head
      - run: python backend/scripts/check_email_verification_migration.py verify
      - run: python backend/scripts/check_daily_quota_migration.py verify
      - run: alembic -c backend/alembic.ini upgrade head
      - if: matrix.database_provider == 'self-managed'
        run: psql -h 127.0.0.1 -U postgres -d flare -v ON_ERROR_STOP=1 -f backend/db/configure-worker.sql
      - run: python -m pip check
      - run: pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/*.test.cjs
      - run: node --test src/features/insights/scheduled-analysis.test.cjs
      - run: npm run lint
      - run: npm run build
