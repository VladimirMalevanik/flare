name: macOS desktop release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/macos-release.yml"
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  test:
    name: Desktop security tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check main.cjs
      - run: node --check security.cjs
      - run: node --test test/*.test.cjs

  build:
    name: Build macOS ${{ matrix.arch }}
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build distributables
        run: pnpm dist:mac:${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: flare-macos-${{ matrix.arch }}
          path: |
            desktop/dist/Flare-macOS-${{ matrix.arch }}.dmg
            desktop/dist/Flare-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flare-macos-*
          path: release-assets
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --generate-notes \
              --title "Flare for macOS ${GITHUB_REF_NAME#desktop-v}"
          fi
