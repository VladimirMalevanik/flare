name: Azure services ZIP redeploy

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable Azure release tag to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            app: flare-api-vm-260914
            asset: flare-backend.zip
          - service: worker
            app: flare-worker-vm-260914
            asset: flare-backend.zip
          - service: web
            app: flare-web-vm-260914
            asset: flare-web.zip
    steps:
      - name: Download immutable release package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download '${{ inputs.release_tag }}' \
            --pattern '${{ matrix.asset }}' \
            --pattern '${{ matrix.asset }}.sha256' \
            --dir "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          sha256sum -c '${{ matrix.asset }}.sha256'
          unzip -tq '${{ matrix.asset }}'
      - name: Deploy ${{ matrix.service }} through Kudu ZIP deploy
        env:
          AZURE_API_PUBLISH_USER: ${{ secrets.AZURE_API_PUBLISH_USER }}
          AZURE_API_PUBLISH_PASSWORD: ${{ secrets.AZURE_API_PUBLISH_PASSWORD }}
          AZURE_WORKER_PUBLISH_USER: ${{ secrets.AZURE_WORKER_PUBLISH_USER }}
          AZURE_WORKER_PUBLISH_PASSWORD: ${{ secrets.AZURE_WORKER_PUBLISH_PASSWORD }}
          AZURE_WEB_PUBLISH_USER: ${{ secrets.AZURE_WEB_PUBLISH_USER }}
          AZURE_WEB_PUBLISH_PASSWORD: ${{ secrets.AZURE_WEB_PUBLISH_PASSWORD }}
          FLARE_AZURE_SERVICE: ${{ matrix.service }}
          FLARE_AZURE_APP: ${{ matrix.app }}
          FLARE_RELEASE_ASSET: ${{ matrix.asset }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import time
          import urllib.parse
          import urllib.request

          service = os.environ["FLARE_AZURE_SERVICE"].upper()
          app = os.environ["FLARE_AZURE_APP"]
          username = os.environ[f"AZURE_{service}_PUBLISH_USER"]
          password = os.environ[f"AZURE_{service}_PUBLISH_PASSWORD"]
          archive = Path(os.environ["RUNNER_TEMP"]) / "release" / os.environ["FLARE_RELEASE_ASSET"]
          authorization = base64.b64encode(f"{username}:{password}".encode()).decode()
          headers = {
              "Authorization": f"Basic {authorization}",
              "Content-Type": "application/zip",
              "User-Agent": "flare-release-deploy/1",
          }
          endpoint = f"https://{app}.scm.azurewebsites.net/api/zipdeploy?isAsync=true&clean=true"
          request = urllib.request.Request(
              endpoint, data=archive.read_bytes(), headers=headers, method="POST"
          )
          with urllib.request.urlopen(request, timeout=180) as response:
              location = response.headers.get("Location")
          if not location:
              raise SystemExit("zip-deploy-status=missing")
          location = urllib.parse.urljoin(endpoint, location)
          for _ in range(120):
              status_request = urllib.request.Request(location, headers=headers)
              with urllib.request.urlopen(status_request, timeout=30) as response:
                  payload = json.load(response)
              if payload.get("complete"):
                  status = payload.get("status")
                  print(f"zip-deploy-status={status}")
                  if status != 4:
                      raise SystemExit("zip-deploy=failed")
                  break
              time.sleep(5)
          else:
              raise SystemExit("zip-deploy=timeout")
          PY
