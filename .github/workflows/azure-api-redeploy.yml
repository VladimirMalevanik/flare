name: Azure API ZIP redeploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Download immutable backend package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download azure-40956bcffe33 \
            --pattern flare-backend.zip \
            --pattern flare-backend.zip.sha256 \
            --dir "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          sha256sum -c flare-backend.zip.sha256
          unzip -tq flare-backend.zip
      - name: Deploy API through Kudu ZIP deploy
        env:
          AZURE_API_PUBLISH_USER: ${{ secrets.AZURE_API_PUBLISH_USER }}
          AZURE_API_PUBLISH_PASSWORD: ${{ secrets.AZURE_API_PUBLISH_PASSWORD }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import time
          import urllib.parse
          import urllib.request

          username = os.environ["AZURE_API_PUBLISH_USER"]
          password = os.environ["AZURE_API_PUBLISH_PASSWORD"]
          archive = Path(os.environ["RUNNER_TEMP"]) / "release" / "flare-backend.zip"
          authorization = base64.b64encode(f"{username}:{password}".encode()).decode()
          headers = {
              "Authorization": f"Basic {authorization}",
              "Content-Type": "application/zip",
              "User-Agent": "flare-release-deploy/1",
          }
          endpoint = (
              "https://flare-api-vm-260914.scm.azurewebsites.net"
              "/api/zipdeploy?isAsync=true&clean=true"
          )
          request = urllib.request.Request(
              endpoint, data=archive.read_bytes(), headers=headers, method="POST"
          )
          with urllib.request.urlopen(request, timeout=180) as response:
              location = response.headers.get("Location")
          if not location:
              raise SystemExit("zip-deploy-status=missing")
          location = urllib.parse.urljoin(endpoint, location)
          for _ in range(120):
              status_request = urllib.request.Request(location, headers=headers)
              with urllib.request.urlopen(status_request, timeout=30) as response:
                  payload = json.load(response)
              if payload.get("complete"):
                  status = payload.get("status")
                  print(f"zip-deploy-status={status}")
                  if status != 4:
                      raise SystemExit("zip-deploy=failed")
                  break
              time.sleep(5)
          else:
              raise SystemExit("zip-deploy=timeout")
          PY
