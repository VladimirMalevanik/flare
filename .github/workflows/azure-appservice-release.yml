name: Azure App Service release packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-appservice-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Build web package
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PRIVATE_STANDALONE: "true"
      API_INTERNAL_URL: https://flare-api-vm-260914.azurewebsites.net
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_DATA_PROVIDER: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/*.test.cjs
      - run: npm run lint
      - run: npm run build
      - name: Package standalone web server
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/flare-web"
          archive="$RUNNER_TEMP/flare-web.zip"
          rm -rf "$release_dir" "$archive"
          mkdir -p "$release_dir/.next"
          cp -a .next/standalone/. "$release_dir/"
          cp -a .next/static "$release_dir/.next/static"
          cp -a public "$release_dir/public"
          printf '%s\n' "$GITHUB_SHA" > "$release_dir/RELEASE_SHA"
          printf '[config]\nSCM_DO_BUILD_DURING_DEPLOYMENT=false\n' > "$release_dir/.deployment"
          test -f "$release_dir/server.js"
          test -f "$release_dir/.next/BUILD_ID"
          test -d "$release_dir/node_modules"
          while IFS= read -r -d '' module; do
            description=$(file -b "$module")
            case "$description" in
              *ELF*x86-64*) ;;
              *) echo "Unexpected native module: $module ($description)" >&2; exit 1 ;;
            esac
          done < <(find "$release_dir" -type f -name '*.node' -print0)
          (cd "$release_dir" && zip -Xqr "$archive" .)
          (cd "$RUNNER_TEMP" && sha256sum flare-web.zip > flare-web.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: azure-web
          path: |
            ${{ runner.temp }}/flare-web.zip
            ${{ runner.temp }}/flare-web.zip.sha256
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Build backend package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test backend
        run: |
          python -m pip install -e 'backend[dev]'
          python -m pip check
          pytest -q backend/tests
      - name: Install portable Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/flare-backend-runtime"
          site_packages="$runtime_dir/antenv/lib/python3.12/site-packages"
          rm -rf "$runtime_dir"
          mkdir -p "$site_packages" "$runtime_dir/antenv/bin"
          python -m pip install --no-cache-dir --target "$site_packages" ./backend
          cp -a backend/app "$runtime_dir/app"
          cat > "$runtime_dir/antenv/bin/python" <<'PYTHON_WRAPPER'
          #!/bin/sh
          set -eu
          venv_dir=$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)
          export PYTHONPATH="$venv_dir/lib/python3.12/site-packages${PYTHONPATH:+:$PYTHONPATH}"
          exec python3 "$@"
          PYTHON_WRAPPER
          chmod +x "$runtime_dir/antenv/bin/python"
      - name: Validate portable Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/flare-backend-runtime"
          "$runtime_dir/antenv/bin/python" -m compileall -q "$runtime_dir/app"
          cd "$runtime_dir"
          FLARE_ENV=test EMAIL_VERIFICATION_REQUIRED=false \
            "$runtime_dir/antenv/bin/python" -c 'import fastapi, psycopg, sqlalchemy, uvicorn; import app.main; import app.workers.analysis_worker'
      - name: Archive portable Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/flare-backend-runtime"
          package_dir="$RUNNER_TEMP/flare-backend-package"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          tar --zstd -cf "$package_dir/output.tar.zst" -C "$runtime_dir" .
          test -s "$package_dir/output.tar.zst"
          tar --use-compress-program=unzstd -tf "$package_dir/output.tar.zst" > "$RUNNER_TEMP/flare-backend-files.txt"
          test -s "$RUNNER_TEMP/flare-backend-files.txt"
      - name: Assemble backend deployment ZIP
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/flare-backend-package"
          archive="$RUNNER_TEMP/flare-backend.zip"
          rm -f "$archive"
          cp backend/deploy/bootstrap_flare_api.sh "$package_dir/bootstrap_flare_api.sh"
          cp backend/deploy/bootstrap_flare_worker.sh "$package_dir/bootstrap_flare_worker.sh"
          cp backend/deploy/ensure_ffprobe.py "$package_dir/ensure_ffprobe.py"
          chmod +x "$package_dir/bootstrap_flare_api.sh" "$package_dir/bootstrap_flare_worker.sh"
          printf '%s\n' "$GITHUB_SHA" > "$package_dir/RELEASE_SHA"
          printf '[config]\nSCM_DO_BUILD_DURING_DEPLOYMENT=false\n' > "$package_dir/.deployment"
          (cd "$package_dir" && zip -Xqr "$archive" .)
          (cd "$RUNNER_TEMP" && sha256sum flare-backend.zip > flare-backend.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: azure-backend
          path: |
            ${{ runner.temp }}/flare-backend.zip
            ${{ runner.temp }}/flare-backend.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable deployment assets
    needs: [web, backend]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: azure-*
          path: release-assets
          merge-multiple: true
      - name: Verify packages
        working-directory: release-assets
        run: |
          sha256sum -c flare-web.zip.sha256
          sha256sum -c flare-backend.zip.sha256
          unzip -tq flare-web.zip
          unzip -tq flare-backend.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          tag="azure-${short_sha}"
          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "Azure deployment ${short_sha}" \
            --notes "Immutable Azure App Service deployment packages for commit ${GITHUB_SHA}. Packages contain application code and public runtime dependencies only; environment secrets stay in Azure Key Vault and App Service settings."
