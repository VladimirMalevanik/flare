name: Azure release marker diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full release commit SHA expected on every service
        required: true
        type: string
      service:
        description: Service marker to verify
        required: true
        default: all
        type: choice
        options:
          - all
          - api
          - worker
          - web

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            app: flare-api-vm-260914
          - service: worker
            app: flare-worker-vm-260914
          - service: web
            app: flare-web-vm-260914
    steps:
      - name: Verify ${{ matrix.service }} release marker
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        env:
          AZURE_API_PUBLISH_USER: ${{ secrets.AZURE_API_PUBLISH_USER }}
          AZURE_API_PUBLISH_PASSWORD: ${{ secrets.AZURE_API_PUBLISH_PASSWORD }}
          AZURE_WORKER_PUBLISH_USER: ${{ secrets.AZURE_WORKER_PUBLISH_USER }}
          AZURE_WORKER_PUBLISH_PASSWORD: ${{ secrets.AZURE_WORKER_PUBLISH_PASSWORD }}
          AZURE_WEB_PUBLISH_USER: ${{ secrets.AZURE_WEB_PUBLISH_USER }}
          AZURE_WEB_PUBLISH_PASSWORD: ${{ secrets.AZURE_WEB_PUBLISH_PASSWORD }}
          FLARE_AZURE_SERVICE: ${{ matrix.service }}
          FLARE_AZURE_APP: ${{ matrix.app }}
          FLARE_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python - <<'PY'
          import base64
          import os
          import time
          import urllib.request

          service = os.environ["FLARE_AZURE_SERVICE"].upper()
          app = os.environ["FLARE_AZURE_APP"]
          username = os.environ[f"AZURE_{service}_PUBLISH_USER"]
          password = os.environ[f"AZURE_{service}_PUBLISH_PASSWORD"]
          expected = os.environ["FLARE_EXPECTED_SHA"]
          authorization = base64.b64encode(f"{username}:{password}".encode()).decode()
          request = urllib.request.Request(
              f"https://{app}.scm.azurewebsites.net/api/vfs/site/wwwroot/RELEASE_SHA",
              headers={
                  "Authorization": f"Basic {authorization}",
                  "User-Agent": "flare-release-check/1",
              },
          )
          for attempt in range(4):
              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      actual = response.read().decode("utf-8", "strict").strip()
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(10)
          print(f"service={service.lower()} release-sha={actual}")
          if actual != expected:
              raise SystemExit("release-sha=mismatch")
          PY
